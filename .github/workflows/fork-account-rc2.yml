name: Fork account tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Account package tests
        run: pnpm exec vitest run packages/credentials/deepseek-account --reporter=dot
